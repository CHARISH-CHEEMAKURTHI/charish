<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>registration page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center><h1>register here !</h1>
        <br></br>
        already have an account ? <a href="login.html">login</a>
        <br></br>
    <form name="registration form" method="post" action="login.html">

            <label for="username">user name:</label>
            <input type="text" id="username" name="name" placeholder="username" required>
        <br></br>
            <label for="email">email:</label>
            <input type="email" id="email" name="email" placeholder="email" required>
        <br></br>
            <label for="phone">phone no:</label>
            <input type="tel" id="phone" name="phone" placeholder="phone no" required>
        <br></br>
            <label for="dob">date of birth :</label>
            <input type="date" id="dob" name="dob" required><br>
        <br></br>
            <label>gender:</label>
            <input type="radio" id="male" name="gender" value="male" >
            <label for="male">male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">other</label>
        <br></br>
            <label for="password">password:</label>
            <input type="password" id="password" name="password"><br></br>
            <label for="confirm_password">confirm password:</label>
            <input type="password" id="confirm_password" name="password"><br></br>
        <input type="reset"><br></br>
        <input type="submit">
    </form></center>
</body>
</html>
